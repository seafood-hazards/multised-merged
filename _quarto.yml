project:
  type: website
  pre-render: download_resources.R
  resources:
    - "*.sqlite"
    - libs/

website:
  title: "multised (merged)"
  navbar:
    search: true
    right:
      - icon: github
        href: https://github.com/seafood-hazards/multised-merged
        aria-label: GitHub
    left:
      - text: "Home"
        href: index.qmd
      - text: "DB Design"
        menu:
          - text: "DB Schema (Merged)"
            href: db-schema-merged.qmd
          - text: "DB Schema (Aquaculture)"
            href: db-schema-aquaculture.qmd
      - text: "Data View"
        menu:
          - text: "Data Viewer (Merged)"
            href: data-viewer-merged.qmd
          - text: "Data Viewer (Aquaculture)"
            href: data-viewer-aquaculture.qmd
          - text: "Sediment Map"
            href: sediment-map.qmd
          - text: "Location Map"
            href: location-map.qmd
          - text: "Grain Size Map"
            href: grain-size-map.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    df-print: kable
    include-in-header: header.html

execute:
  echo: false
  warning: false
  message: false
